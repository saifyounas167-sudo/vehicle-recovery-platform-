name: SS11 Admin Browser QA
on:
  push:
    branches: [feature/ss11-premium-admin-dashboard-readonly]
  workflow_dispatch:
jobs:
  admin-browser:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Start local app
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/ss11.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:3000/admin >/dev/null && exit 0
            sleep 2
          done
          cat /tmp/ss11.log
          exit 1
      - name: Playwright seven viewport admin auth guard
        run: node tests/ss11-admin-browser-qa.mjs
