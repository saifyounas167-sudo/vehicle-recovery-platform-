name: Screenshot 3 Estimate Browser QA
on:
  pull_request:
    branches: [main]
jobs:
  estimate-browser:
    if: github.head_ref == 'feature/client-screenshot-3-estimate-result' || github.head_ref == 'feature/ss3-ss4-ss5-dynamic-marketplace'
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start local server
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/estimate-qa.log 2>&1 &
          for i in $(seq 1 45); do curl -sf http://127.0.0.1:3000/recovery/request >/dev/null && exit 0; sleep 2; done
          cat /tmp/estimate-qa.log
          exit 1
      - run: node tests/estimate-browser-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-3-estimate-qa
          path: qa-estimate-screenshots/
          if-no-files-found: ignore
