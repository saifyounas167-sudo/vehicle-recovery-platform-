name: SS6 Booking Confirmation QA
on:
  push:
    branches:
      - feature/ss6-booking-confirmation-readonly
  workflow_dispatch:
jobs:
  ss6:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Unit tests
        run: npm test
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Install browser QA
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start built app
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/ss6-server.log 2>&1 &
          for i in $(seq 1 45); do curl -sf http://127.0.0.1:3000/recovery/booking >/dev/null && exit 0; sleep 2; done
          cat /tmp/ss6-server.log
          exit 1
      - name: SS6 browser QA
        run: node tests/ss6-browser-qa.mjs
      - name: SS4 to SS6 mocked journey QA
        run: node tests/ss4-ss5-browser-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ss6-mocked-and-preview-screenshots
          path: |
            qa-ss6-screenshots/
            qa-dynamic-marketplace/
          if-no-files-found: ignore
