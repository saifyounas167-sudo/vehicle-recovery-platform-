name: SS10 Driver Dashboard Browser QA
on:
  push:
    branches: [feature/ss10-premium-driver-dashboard-readonly]
  workflow_dispatch:
jobs:
  driver-browser:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Start local read-only app
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/ss10.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:3000/driver >/dev/null && exit 0
            sleep 2
          done
          cat /tmp/ss10.log
          exit 1
      - name: Driver authorization browser QA at seven widths
        run: node tests/ss10-driver-auth-browser-qa.mjs
