name: Dashboard Preview Mode QA
on:
  push:
    branches: [feature/dashboard-preview-mode-readonly]
  workflow_dispatch:
jobs:
  preview:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mode: [enabled, disabled]
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
      VERCEL_ENV: preview
      DASHBOARD_PREVIEW_MODE: ${{ matrix.mode }}
      NEXT_PUBLIC_DASHBOARD_PREVIEW_MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Start preview app
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/preview.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3000/ >/dev/null && exit 0; sleep 2; done
          cat /tmp/preview.log; exit 1
      - run: node tests/dashboard-preview-browser.mjs
