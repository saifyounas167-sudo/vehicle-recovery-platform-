name: Customer Dashboard Frontend QA
on:
  push:
    branches: [feature/customer-dashboard-premium-ss-reference]
  workflow_dispatch:
jobs:
  qa:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Unit and security tests
        run: npm test
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start app
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/customer-dashboard.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS 'http://127.0.0.1:3000/login?role=customer' >/dev/null && exit 0; sleep 2; done
          cat /tmp/customer-dashboard.log
          exit 1
      - name: Responsive customer route security QA
        run: node tests/customer-dashboard-browser-qa.mjs
